[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laut-ocean"
version = "0.1.0"
description = "Local Assessment for Upper-ocean Tropical ocean processes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [{name = "LAUT contributors"}]
keywords = ["ocean", "NEMO", "model evaluation", "Southeast Asia", "climate downscaling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
ocean = [
  "xarray>=2024.1",
  "pandas>=2.1",
  "fsspec>=2024.2",
  "netCDF4>=1.6",
  "zarr>=2.17",
  "dask[array]>=2024.2",
]
plot = ["matplotlib>=3.8"]
test = ["pytest>=8", "pytest-cov>=5"]
dev = [
  "xarray>=2024.1",
  "pandas>=2.1",
  "fsspec>=2024.2",
  "netCDF4>=1.6",
  "zarr>=2.17",
  "dask[array]>=2024.2",
  "matplotlib>=3.8",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
laut = "laut.cli:main"

[project.urls]
Documentation = "https://github.com/dannisu/LAUT#readme"
Issues = "https://github.com/dannisu/LAUT/issues"
Source = "https://github.com/dannisu/LAUT"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laut = ["resources/*.toml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
