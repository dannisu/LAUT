section = "O2"
rank = "T2"
name = "Seasonal MLD relative error"
variable = "mixed_layer_depth"
metric = "relative_error_percent"
units = "percent"
baseline = "observations"
reference = "EN4-derived climatology"
group = "O2_MLD"
group_rule = "any"
target = {operator = "le", value = 20.0}
threshold = {operator = "le", value = 30.0}

[[criteria]]
id = "O2_SLA_RMSE"
section = "O2"
rank = "T4"
name = "De-meaned sea-level anomaly RMSE"
variable = "sea_level_anomaly"
metric = "rmse"
units = "cm"
baseline = "observations"
reference = "CMEMS altimetry SEALEVEL_GLO_PHY_L4_MY_008_047"
target = {operator = "le", value = 4.0}
threshold = {operator = "le", value = 6.0}

[[criteria]]
id = "O2_SLA_CORRELATION"
section = "O2"
rank = "T4"
name = "De-meaned sea-level anomaly correlation"
variable = "sea_level_anomaly"
metric = "pattern_correlation"
units = "1"
baseline = "observations"
reference = "CMEMS altimetry SEALEVEL_GLO_PHY_L4_MY_008_047"
target = {operator = "ge", value = 0.8}
threshold = {operator = "ge", value = 0.7}

[[criteria]]
