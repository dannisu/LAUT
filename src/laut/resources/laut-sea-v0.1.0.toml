metric = "rmse"
units = "cm"
baseline = "observations"
reference = "GESLA tide gauges"
target = {operator = "le", value = 5.0}
threshold = {operator = "le", value = 8.0}

[[criteria]]
id = "O2_COASTAL_SSH_CORRELATION"
section = "O2"
rank = "T4"
name = "De-meaned coastal sea-level correlation"
variable = "coastal_sea_level"
metric = "pattern_correlation"
units = "1"
