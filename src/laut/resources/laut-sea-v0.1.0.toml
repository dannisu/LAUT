rank = "T2"
name = "Subsurface temperature bias, 0 to 500 m"
variable = "subsurface_temperature"
metric = "bias"
units = "degC"
baseline = "observations"
reference = "EN4 and Argo"
target = {operator = "abs_le", value = 0.5}
threshold = {operator = "abs_le", value = 1.0}

[[criteria]]
