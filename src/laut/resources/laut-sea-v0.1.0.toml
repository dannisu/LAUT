[framework]
name = "LAUT Southeast Asia regional-ocean evaluation framework"
version = "0.1.0"
status = "proposal"
region = "Southeast Asia and western Maritime Continent"
description = "Machine-readable implementation of ocean criteria O1-O10, staged testing S0-S4, and tuning priority T1-T7."
minimum_acceptance_stage = "S4"
calibration_required = true
calibration_reference = "Existing 20-year CCRS-NEMO-SEA hindcast"
threshold_note = "Values are literature-derived proposals until calibrated against the existing hindcast."

[[stages]]
id = "S0"
name = "Barotropic, stratified, tide-only"
duration = "1 to 2 weeks"
purpose = "Geometry, bathymetry, open boundaries, and tidal dynamics"
gate = "Completes; tidal harmonics reasonable; no boundary reflection"

[[stages]]
id = "S1"
name = "Numerical stability check"
duration = "2 months, full baroclinic"
purpose = "CFL, blow-ups, spurious mixing, and energy behaviour"
gate = "No blow-up, runaway kinetic energy, or grid-scale noise"

[[stages]]
id = "S2"
name = "Annual cycle"
duration = "1 year"
purpose = "Monsoon reversal, seasonal MLD cycle, and seasonal ITF"
gate = "Correct sign and approximate seasonal amplitude"

[[stages]]
id = "S3"
name = "Spin-up (output discarded)"
duration = "3 to 5 years from a soft restart; longer from rest"
purpose = "Interior adjustment, ITF, and EKE saturation"
gate = "Drift stabilising and ITF within O3 range"

[[stages]]
id = "S4"
name = "Evaluation run"
duration = "At least 20 years, for example 1995 to 2014"
purpose = "Evaluate all criteria in O2 to O6"
gate = "Only S4 output is eligible for acceptance"

[[tuning_ranks]]
id = "T1"
name = "Surface fluxes and SST"
rationale = "The atmosphere responds directly to SST; coupled criteria depend on it."
parameters = ["namsbc_blk", "namtra_qsr", "namsbc_ssr", "ln_skin_cs", "ln_skin_wl"]
diagnostics = ["SST bias", "SST RMSE", "SST pattern correlation", "marine heatwaves"]

[[tuning_ranks]]
id = "T2"
name = "Vertical mixing, MLD, and thermocline depth"
rationale = "Vertical structure controls SST response and upwelled-water temperature."
parameters = ["namzdf_tke", "namzdf_gls", "rn_avt0", "rn_avm0", "ln_zdfiwm", "ln_lc"]
diagnostics = ["MLD bias", "20 degC isotherm depth", "subsurface temperature bias"]

[[tuning_ranks]]
id = "T3"
name = "ITF and strait transports"
rationale = "The ITF sets the regional heat and freshwater budget."
parameters = ["domain_cfg bathymetry and sill depths", "namdrg", "nambdy", "namtra_adv"]
diagnostics = ["total ITF", "strait partitioning", "vertical structure", "seasonal cycle"]

[[tuning_ranks]]
id = "T4"
name = "Sea-level gradients and tides"
rationale = "SSH gradients determine currents; tides feed back into mixing."
parameters = ["nam_tide", "namdyn_spg", "namdyn_hpg", "namdrg"]
diagnostics = ["de-meaned SLA", "coastal sea level", "tidal amplitude and phase"]

[[tuning_ranks]]
id = "T5"
name = "Salinity and stratification"
rationale = "Salinity is first-order for stratification, the Sunda Shelf, and ITF water masses."
parameters = ["namsbc_rnf", "rn_pfac", "namsbc_ssr", "namtra_ldf"]
diagnostics = ["SSS bias", "SSS RMSE", "river plumes", "ITF outflow"]

[[tuning_ranks]]
id = "T6"
name = "EKE and the mesoscale"
rationale = "Regional value-add is interpretable only after T1 to T5 are credible."
parameters = ["namdyn_ldf", "namdyn_vor", "namdyn_adv", "namlbc", "ln_ldfeiv"]
diagnostics = ["EKE", "eddy census", "SSH spectra", "SST gradients"]

[[tuning_ranks]]
id = "T7"
name = "Deep drift"
rationale = "Deep drift is decisive for century-scale projections."
parameters = ["namtra_dmp", "namzdf", "namtra_bbl", "nambdy"]
diagnostics = ["deep temperature trend", "salinity trend", "steric drift", "heat budget"]

# O2: mean state ---------------------------------------------------------------

[[criteria]]
id = "O2_SST_BIAS"
section = "O2"
rank = "T1"
name = "Seasonal and annual SST domain bias"
variable = "sst"
metric = "bias"
units = "degC"
baseline = "observations"
reference = "OSTIA or OISST"
applicability = "forced"
target = {operator = "abs_le", value = 0.5}
threshold = {operator = "abs_le", value = 1.0}
notes = "Local bias up to 2 degC is allowed only where documented and physically understood."

[[criteria]]
id = "O2_SST_RMSE"
section = "O2"
rank = "T1"
name = "Seasonal and annual SST RMSE"
variable = "sst"
metric = "rmse"
units = "degC"
baseline = "observations"
reference = "OSTIA or OISST"
applicability = "forced"
target = {operator = "le", value = 0.5}
threshold = {operator = "le", value = 0.75}

[[criteria]]
id = "O2_SST_PCC"
section = "O2"
rank = "T1"
name = "SST spatial-pattern correlation"
variable = "sst"
metric = "pattern_correlation"
units = "1"
baseline = "observations"
reference = "OSTIA or OISST"
target = {operator = "ge", value = 0.95}
threshold = {operator = "ge", value = 0.90}

[[criteria]]
id = "O2_SUBSURFACE_TEMP_BIAS"
